// Message definitions for low-level robot telemetry, sensor readings,
// and actuation commands for the Wheelly robot.
syntax = "proto3";

option java_multiple_files = true;
option java_package = "org.mmarini.wheelly.protobuf.aruco";

package wheelly.protobuf.aruco;

// Event generated when the vision system detects a fiducial marker in a camera frame.
message MarkerEvent {
  // Timestamp when the camera frame was captured (in milliseconds).
  int64 timestamp = 1;
  // Unique identifier of the detected fiducial marker.
  sint32 markerId = 2;
  // Width of the captured image frame in pixels.
  int32 width = 3;
  // Height of the captured image frame in pixels.
  int32 height = 4;
  // Flattened list of 2D image coordinates (e.g. corner points) of the detected marker.
  repeated int32 coords = 5;
}
