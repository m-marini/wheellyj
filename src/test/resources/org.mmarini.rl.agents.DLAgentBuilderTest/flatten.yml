---
$schema: https://mmarini.org/wheelly/dl-agent-builder-schema-1.0
class: org.mmarini.rl.agents.DLAgentBuilder
numEpochs: 5
trajectorySize: 255
batchSize: 32
alphas:
  action: 0.8
beta: 0.9
avgReward: 0.1
path: tmp/model
network:
  activation: Identity
  updater:
    type: RmsProp
    learningRate: 0.1
    decayRms: 0.96
    epsilon: 1e-3
    optimizationAlgo:
  weightInit:
    type: TruncatedNormalDistribution
    mean: 0
    stddev: 0.5
  l1: 1e-7
  l2: 5e-5
  graphBuilder:
    inputs:
      map:
        type: Convolutional
        width: 3
        height: 3
        depth: 4
      other:
        type: FeedForward
        size: 1
    hiddens:
      pool:
        type: SubsamplingLayer
        kernelSize: [ 3, 3 ]
        poolingType: Avg
        inputs: [ map ]
    vertices:
      flatten:
        type: FlattenVertex
        inputs: [ pool ]
    outputs:
      out:
        type: OutputLayer
        lossFunction: NegativeLogLikelihood
        inputs: [ flatten, other ]
        nOut: 10
        activation: SoftMax
