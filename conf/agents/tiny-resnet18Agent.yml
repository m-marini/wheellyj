---
$schema: https://mmarini.org/wheelly/rl-agent-builder-schema-2.0
class: org.mmarini.wheelly.rlagents.RLAgentBuilder
numEpochs: 3
trajectorySize: 256
batchSize: 32
alphas:
  action-head: 1e-9
  action-move: 1e-15
beta: 3e-3
gamma: 0.99
avgReward: 0.5
path: models/tiny-resnet18
network:
  activation: Identity
  updater:
    type: RmsProp
    learningRate: 1e-6
    decayRms: 0.96
    epsilon: 1e-3
  optimizationAlog: StochasticGradientDescent
  weightInit:
    type: He
  #weightInit:
  #  type: TruncatedNormalDistribution
  #  mean: 0
  #  stddev: 0.5
  l1: 1e-7
  l2: 5e-5
  graphBuilder:

    # map(6.9m x 6.9m)                 5 x 69 x 69
    # cnn-in cnn(64, k=6, s=1, p=0)   32 x 64 x 64
    # resnet11 resnet(64, k=3, s=2)   64 x 32 x 32
    # resnet12 resnet(64, k=3, s=1)   64 x 32 x 32
    # resnet21 resnet(128, k=3, s=2) 128 x 16 x 16
    # resnet22 resnet(128, k=3, s=1) 128 x 16 x 16
    # resnet31 resnet(128, k=3, s=2) 128 x  8 x  8
    # resnet32 resnet(128, k=3, s=1) 128 x  8 x  8
    # resnet41 resnet(256, k=3, s=2) 128 x  4 x  4
    # resnet42 resnet(256, k=3, s=1) 128 x  4 x  4
    # avgpool  avg pooling(128)      128 x  1 x  1

    # robot  8 + 4  = 12
    # head   7 + 3  = 10
    # proxy            4
    # camera 4 + 1  =  5
    # fsm    16 + 9 = 25

    # merge-sensors 56
    # dense1 92
    # batch
    # relu
    # dense2 128
    # batch
    # relu

    # merge-all 256 + 256 = 512
    inputs:
      state-map:
        # map 5 x 69 x 69
        type: Convolutional
        width: 69
        height: 69
        depth: 5
        format: NCHW
      state-robot:
        # 8 sensors + 4 state
        type: FeedForward
        size: 12
      state-head:
        # 7 sensors + 3 state
        type: FeedForward
        size: 10
      state-proxy:
        # 4 sensors
        type: FeedForward
        size: 4
      state-camera:
        # 4 sensors + 1 marker
        type: FeedForward
        size: 5
      state-fsm:
        # 16 motion states + 9 head state
        type: FeedForward
        size: 25
    hiddens:
      cnn-in:
        # cnn-in cnn(32, k=6, s=1, p=0) 32 x 64 x 64
        inputs: [ state-map ]
        type: ConvolutionLayer
        nOut: 32
        kernelSize: [ 6, 6 ]
        stride: [ 1, 1 ]
      batch-in:
        inputs: [ cnn-in ]
        type: BatchNormalizationLayer
      relu-in:
        inputs: [ batch-in ]
        type: ActivationLayer
        activation: Relu

      dense-sensors0:
        type: DenseLayer
        inputs: [ state-robot, state-head, state-proxy, state-camera, state-fsm ]
        nOut: 92
        weightInit:
          type: Xavier
      batch-sensors0:
        inputs: [ dense-sensors0 ]
        type: BatchNormalizationLayer
      relu-sensors0:
        inputs: [ batch-sensors0 ]
        type: ActivationLayer
        activation: Relu

      dense-sensors1:
        type: DenseLayer
        inputs: [ relu-sensors0 ]
        nOut: 128
        weightInit:
          type: Xavier
      batch-sensors1:
        inputs: [ dense-sensors1 ]
        type: BatchNormalizationLayer
      relu-sensors1:
        inputs: [ batch-sensors1 ]
        type: ActivationLayer
        activation: Relu

      dense-out:
        type: DenseLayer
        inputs: [ relu-sensors1, flatten-map ]
        nOut: 256
        weightInit:
          type: Xavier
      batch-out:
        inputs: [ dense-out ]
        type: BatchNormalizationLayer
      out:
        inputs: [ batch-out ]
        type: ActivationLayer
        activation: Relu

      avgpool-out:
        # avgpool-out subsampling(3,3) 256 x 1 x 1
        inputs: [ resnet42 ]
        type: SubsamplingLayer
        kernelSize: [ 1, 1 ]
        poolingType: Avg

    blocks:
      resnet11:
        # resnet11 resnet(64, k=3, s=2, p=1)   64 x 32 x 32
        inputs: [ relu-in ]
        type: ConvolutionResNetBlock
        depth: 64
        kernelSize: [ 3, 3 ]
        stride: [ 2, 2 ]
      resnet12:
        # resnet12 resnet(64, k=3, s=1) 64 x 32 x 32
        inputs: [ resnet11 ]
        type: IdentityResNetBlock
        depth: 64
        kernelSize: [ 3, 3 ]

      resnet21:
        # resnet21 resnet(128, k=3, s=2)      128 x 16 x 16
        inputs: [ resnet12 ]
        type: ConvolutionResNetBlock
        depth: 128
        kernelSize: [ 3, 3 ]
        stride: [ 2, 2 ]
      resnet22:
        # resnet22 resnet(128, k=3, s=1)  128 x 16 x 16
        inputs: [ resnet21 ]
        type: IdentityResNetBlock
        depth: 128
        kernelSize: [ 3, 3 ]

      resnet31:
        # resnet31 resnet(128, k=3, s=2, p=1) 128 x  8 x 8
        inputs: [ resnet22 ]
        type: ConvolutionResNetBlock
        depth: 128
        kernelSize: [ 3, 3 ]
        stride: [ 2, 2 ]
      resnet32:
        # resnet32 resnet(128, k=3, s=1)   128 x 8 x 8
        inputs: [ resnet31 ]
        type: IdentityResNetBlock
        depth: 128
        kernelSize: [ 3, 3 ]
      resnet41:
        # resnet41 resnet(256, k=3, s=2) 256 x 4 x 4
        inputs: [ resnet32 ]
        type: ConvolutionResNetBlock
        depth: 128
        kernelSize: [ 3, 3 ]
        stride: [ 2, 2 ]
      resnet42:
        # resnet42 resnet(256, k=3, s=1) 256 x 8 x 8
        inputs: [ resnet41 ]
        type: IdentityResNetBlock
        depth: 128
        kernelSize: [ 3, 3 ]

    outputs:
      critic:
        type: OutputLayer
        inputs: [ out ]
        nOut: 1
        activation: Identity
        lossFunction: SquaredLoss
        weightInit:
          type: Xavier
      action-move:
        type: OutputLayer
        inputs: [ out ]
        nOut: 16
        activation: SoftMax
        lossFunction: NegativeLogLikelihood
        weightInit:
          type: Xavier
      action-head:
        type: OutputLayer
        inputs: [ out ]
        nOut: 9
        activation: SoftMax
        lossFunction: NegativeLogLikelihood
        weightInit:
          type: Xavier
    vertices:
      flatten-map:
        type: FlattenVertex
        inputs: [ avgpool-out ]