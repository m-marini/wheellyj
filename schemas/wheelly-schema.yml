---
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://mmarini.org/wheelly/wheelly-schema-4.0
title: Wheelly application

# monitor schema
type: object
properties:
  $schema:
    type: string
    const: https://mmarini.org/wheelly/wheelly-schema-4.0
  adapter:
    type: string
  agent:
    type: string
  behaviour:
    type: string
  controller:
    type: string
  perceptor:
    type: string
  rewardFunction:
    type: string
  robot:
    type: string
  savingInterval:
    type: integer
    minimum: 1
required:
  - $schema
  - robot
  - controller
  - perceptor
  - behaviour
  - rewardFunction
  - adapter
  - agent
  - savingInterval
