---
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://mmarini.org/wheelly/batch-schema-1.0
title: Wheelly application

# monitor schema
type: object
properties:
  $schema:
    type: string
    const: https://mmarini.org/wheelly/batch-schema-1.0
  seed:
    type: integer
  numEpochs:
    type: integer
    minimum: 1
  robot:
    type: string
  controller:
    type: string
  perceptor:
    type: string
  behaviour:
    type: string
  adapter:
    type: string
  agent:
    type: string
  rewardFunction:
    type: string
required:
  - $schema
  - robot
  - controller
  - perceptor
  - behaviour
  - adapter
  - agent
  - rewardFunction
